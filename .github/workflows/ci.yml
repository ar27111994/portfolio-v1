name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  coverage:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const pct = (n) => (n?.pct ?? 0).toFixed(1);
              console.log('Statements:', pct(c.statements), '%');
              console.log('Branches:', pct(c.branches), '%');
              console.log('Functions:', pct(c.functions), '%');
              console.log('Lines:', pct(c.lines), '%');
            "
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build site
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test
        env:
          TEST_URL: http://localhost:4321
